<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenIoTData · Flujo de publicación</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif;
      --serif: 'Instrument Serif', Georgia, serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 2rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
    }
    .frame { width: 100%; max-width: 1280px; }
    svg { display: block; width: 100%; min-width: 900px; }
    .lane-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: .12em; text-anchor: middle; }
    .step-label { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: .12em; text-anchor: middle; }
    .node-name { fill: var(--ink); font: 600 11px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 8px var(--mono); text-anchor: middle; }
    .node-chip { fill: var(--soft); font: 500 7px var(--mono); letter-spacing: .08em; text-anchor: middle; }
    .arrow-label { fill: var(--muted); font: 400 7.5px var(--mono); letter-spacing: .05em; text-anchor: middle; }
    .legend { fill: var(--muted); font: 400 8.5px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <svg viewBox="0 0 1240 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="openiotdata-ingestion-flow-title openiotdata-ingestion-flow-desc">
      <title id="openiotdata-ingestion-flow-title">Flujo de publicación e ingesta de OpenIoTData</title>
      <desc id="openiotdata-ingestion-flow-desc">El publicador o dispositivo crea un borrador y aporta un recurso; la API lo persiste, el worker lo escanea e infiere a Parquet, el publicador mapea su semántica y la API publica una versión inmutable para el catálogo.</desc>
      <defs>
        <pattern id="ingestion-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r=".9" fill="rgba(45,49,66,.10)"/>
        </pattern>
        <marker id="ingestion-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="ingestion-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="ingestion-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#7a8399"/>
        </marker>
      </defs>

      <rect width="1240" height="660" fill="#f5f5f5"/>
      <rect width="1240" height="660" fill="url(#ingestion-dots)" opacity=".55"/>

      <!-- Four horizontal responsibility lanes. -->
      <rect x="160" y="40" width="1040" height="100" fill="rgba(45,49,66,.018)"/>
      <rect x="160" y="240" width="1040" height="100" fill="rgba(45,49,66,.018)"/>
      <rect x="160" y="440" width="1040" height="100" fill="rgba(45,49,66,.018)"/>
      <line x1="160" y1="40" x2="1200" y2="40" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
      <line x1="160" y1="140" x2="1200" y2="140" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
      <line x1="160" y1="240" x2="1200" y2="240" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
      <line x1="160" y1="340" x2="1200" y2="340" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
      <line x1="160" y1="440" x2="1200" y2="440" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
      <line x1="160" y1="540" x2="1200" y2="540" stroke="rgba(45,49,66,.14)" stroke-width=".8"/>
      <line x1="160" y1="40" x2="160" y2="540" stroke="rgba(45,49,66,.22)" stroke-width="1"/>

      <!-- Step headers. -->
      <rect x="198" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,.12)"/>
      <text x="206" y="23" class="step-label" fill="var(--ink)">1</text><text x="206" y="36" class="step-label">DEFINE</text>
      <rect x="358" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,.12)"/>
      <text x="366" y="23" class="step-label" fill="var(--ink)">2</text><text x="366" y="36" class="step-label">UPLOAD</text>
      <rect x="518" y="12" width="16" height="16" rx="8" fill="rgba(235,108,54,.20)"/>
      <text x="526" y="23" class="step-label" fill="#eb6c36">3</text><text x="526" y="36" class="step-label" fill="#eb6c36">PROCESS</text>
      <rect x="678" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,.12)"/>
      <text x="686" y="23" class="step-label" fill="var(--ink)">4</text><text x="686" y="36" class="step-label">MAP</text>
      <rect x="838" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,.12)"/>
      <text x="846" y="23" class="step-label" fill="var(--ink)">5</text><text x="846" y="36" class="step-label">PUBLISH</text>
      <rect x="998" y="12" width="16" height="16" rx="8" fill="rgba(45,49,66,.12)"/>
      <text x="1006" y="23" class="step-label" fill="var(--ink)">6</text><text x="1006" y="36" class="step-label">REUSE</text>

      <!-- Lane labels. -->
      <text x="80" y="86" class="lane-label">PUBLICADOR</text><text x="80" y="98" class="lane-label">/ DEVICE</text>
      <text x="80" y="286" class="lane-label">API</text><text x="80" y="298" class="lane-label">FASTAPI</text>
      <text x="80" y="386" class="lane-label">WORKER</text><text x="80" y="398" class="lane-label">CELERY</text>
      <text x="80" y="486" class="lane-label">CATÁLOGO</text><text x="80" y="498" class="lane-label">PÚBLICO</text>

      <!-- Explicit edges. -->
      <path d="M246 90 H326 V290 H332" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ingestion-arrow)"/>
      <path d="M406 290 H486 V390 H492" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ingestion-arrow-accent)"/>
      <path d="M566 390 H646 V90 H652" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ingestion-arrow)"/>
      <path d="M726 90 H806 V290 H812" fill="none" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ingestion-arrow)"/>
      <path d="M886 290 H966 V490 H972" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#ingestion-arrow-accent)"/>
      <path d="M1046 490 H1120 V290 H1126" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#ingestion-arrow-soft)"/>
      <path d="M566 390 H606 Q618 390 618 430 V490 H652" fill="none" stroke="#7a8399" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#ingestion-arrow-soft)"/>

      <!-- Arrow labels. -->
      <rect x="260" y="174" width="46" height="14" rx="3" fill="#f5f5f5"/><text x="283" y="184" class="arrow-label">METADATA</text>
      <rect x="426" y="314" width="48" height="14" rx="3" fill="#f5f5f5"/><text x="450" y="324" class="arrow-label" fill="#eb6c36">RESOURCE</text>
      <rect x="574" y="248" width="66" height="14" rx="3" fill="#f5f5f5"/><text x="607" y="258" class="arrow-label">PARQUET</text>
      <rect x="746" y="174" width="46" height="14" rx="3" fill="#f5f5f5"/><text x="769" y="184" class="arrow-label">MAPPING</text>
      <rect x="906" y="364" width="54" height="14" rx="3" fill="#f5f5f5"/><text x="933" y="374" class="arrow-label" fill="#eb6c36">VERSION</text>
      <rect x="1060" y="364" width="54" height="14" rx="3" fill="#f5f5f5"/><text x="1087" y="374" class="arrow-label">QUERY</text>
      <rect x="586" y="446" width="60" height="14" rx="3" fill="#f5f5f5"/><text x="616" y="456" class="arrow-label">QUARANTINE</text>

      <!-- Nodes, one per occupied lane/step cell. -->
      <rect x="166" y="58" width="80" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.30)" stroke-width="1"/>
      <rect x="174" y="66" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.3)" stroke-width=".8"/><text x="192" y="75" class="node-chip">META</text>
      <text x="206" y="96" class="node-name">Borrador</text><text x="206" y="112" class="node-sub">title + license</text>

      <rect x="326" y="258" width="80" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.30)" stroke-width="1"/>
      <rect x="334" y="266" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.3)" stroke-width=".8"/><text x="352" y="275" class="node-chip">FILE</text>
      <text x="366" y="296" class="node-name">Upload</text><text x="366" y="312" class="node-sub">checksum + key</text>

      <rect x="486" y="358" width="80" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="494" y="366" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,.5)" stroke-width=".8"/><text x="512" y="375" class="node-chip" fill="#eb6c36">SCAN</text>
      <text x="526" y="396" class="node-name">Process</text><text x="526" y="412" class="node-sub">ClamAV · infer</text>

      <rect x="646" y="58" width="80" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.30)" stroke-width="1"/>
      <rect x="654" y="66" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.3)" stroke-width=".8"/><text x="672" y="75" class="node-chip">MAP</text>
      <text x="686" y="96" class="node-name">Semántica</text><text x="686" y="112" class="node-sub">time · geo · sensor</text>

      <rect x="806" y="258" width="80" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,.30)" stroke-width="1"/>
      <rect x="814" y="266" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,.3)" stroke-width=".8"/><text x="832" y="275" class="node-chip">PUB</text>
      <text x="846" y="296" class="node-name">Publicar</text><text x="846" y="312" class="node-sub">version immutable</text>

      <rect x="966" y="458" width="80" height="64" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="974" y="466" width="36" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,.5)" stroke-width=".8"/><text x="992" y="475" class="node-chip" fill="#eb6c36">READ</text>
      <text x="1006" y="496" class="node-name">Explorar</text><text x="1006" y="512" class="node-sub">map · query · download</text>

      <!-- Legend. -->
      <line x1="40" y1="574" x2="1200" y2="574" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
      <text x="40" y="594" class="lane-label" text-anchor="start">LEGEND</text>
      <rect x="112" y="584" width="16" height="12" rx="2" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="136" y="594" class="legend">gate / publicación</text>
      <rect x="264" y="584" width="16" height="12" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,.30)" stroke-width="1"/>
      <text x="288" y="594" class="legend">paso de control</text>
      <line x1="420" y1="590" x2="448" y2="590" stroke="#4f5d75" stroke-width="1.1" marker-end="url(#ingestion-arrow)"/>
      <text x="458" y="594" class="legend">flujo de datos</text>
      <line x1="584" y1="590" x2="612" y2="590" stroke="#7a8399" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#ingestion-arrow-soft)"/>
      <text x="622" y="594" class="legend">error / retorno</text>
      <text x="820" y="594" class="legend">Los originales no se mutan; cada publicación crea una versión reproducible.</text>
    </svg>
  </main>
</body>
</html>

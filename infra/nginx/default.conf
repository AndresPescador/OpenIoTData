map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

upstream openiotdata_api {
    server api:8000;
    keepalive 32;
}

upstream openiotdata_frontend {
    server frontend:3000;
    keepalive 16;
}

upstream openiotdata_keycloak {
    server keycloak:8080;
    keepalive 8;
}

server {
    listen 8080;
    server_name localhost openiotdata.localhost;
    # Límite conservador para HTML, formularios de identidad y JSON de API.
    # Las dos rutas de ingesta que necesitan más capacidad lo sobrescriben abajo.
    client_max_body_size 64k;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:9000 http://openiotdata.localhost:8080 https://tile.openstreetmap.org; worker-src 'self' blob:" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # La carga multipart es la única ruta HTTP del portal que admite hasta 1 GiB.
    # Al ser una location regex, debe repetir los controles de proxy y rate limit
    # de /api/; de otro modo Nginx usaría este bloque sin heredarlos.
    location ~ ^/api/v1/datasets/[^/]+/versions/[^/]+/resources/?$ {
        client_max_body_size 1024m;
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://openiotdata_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
    }

    # La ingesta continua tiene un límite propio, alineado con MAX_BATCH_BYTES.
    location ~ ^/api/v1/datasets/[^/]+/records:batch/?$ {
        client_max_body_size 10m;
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://openiotdata_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
    }

    # Sin URI en proxy_pass: /api/v1/... llega al backend sin duplicar /api.
    # El límite de 64 KiB heredado cubre todo JSON general, incluido /query.
    location /api/ {
        client_max_body_size 64k;
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://openiotdata_api;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx es el borde de confianza de esta pila. Sobrescribir evita que el
        # cliente falsifique la IP usada por límites y auditoría.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_read_timeout 300s;
    }

    # Keycloak se publica bajo el mismo origen y conserva el prefijo /auth.
    location /auth/ {
        proxy_pass http://openiotdata_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://openiotdata_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openiotdata-backend"
version = "0.1.0"
description = "API, catalog and heterogeneous ingestion plane for OpenIoTData"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "duckdb>=1.2,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "orjson>=3.10,<4",
  "pyarrow>=18,<24",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pytz>=2025.2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# SQLAlchemy's async driver switches through greenlets; enabling its coverage
# context prevents resumed endpoint bodies from being reported as unexecuted.
concurrency = ["greenlet"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/core/security.py" = ["B008"]
